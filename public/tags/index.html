      html.preloader-active .wrapper {

      #preloader {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0b0b0b;
        z-index: 9999;
        opacity: 1;
        transition: opacity .6s ease;
      }
      
      #preloader.preloader-hide {
        opacity: 0;
        pointer-events: none;
      }

      #preloader img {
        max-width: 60vw;
        max-height: 30vh;
        animation: zoomIn 3s ease-out forwards;
        will-change: transform, opacity;
      }
      
      @keyframes zoomIn {
        from { transform: scale(.2); opacity: .6; }
        to   { transform: scale(1); opacity: 1; }
      }

      @media (max-width: 768px) {
        #preloader img {
          max-width: 100vw;
          max-height: 50vh;
        }
      }
     
      @media (prefers-reduced-motion: reduce) {
        #preloader img { animation: none; }
      }
    </style>

        <script>
      (function () {
        var pre = document.getElementById("preloader");
        if (!pre) return; 
        var DURATION_MS = 2000; 

        function finish() {
          document.documentElement.classList.remove("preloader-active");
          pre.classList.add("preloader-hide");
          pre.addEventListener("transitionend", function () { pre.remove(); }, { once: true });
        }

        window.addEventListener('load', function() {
            setTimeout(finish, DURATION_MS);
        });

      })();
    </script>
